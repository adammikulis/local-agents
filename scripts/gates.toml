# THE ONE GATE LIST. scripts/gate_runner.py runs it; agent_harness.sh lint is a thin call into
# that; check_gpu_gate_list.sh reads the "gpu" rows back. A second list drifts from the first.
#
# kind = "text"     no engine, runs in the worker pool. A text gate that launches one is a
#                   violation the runner reports: each gate gets its own launch ledger.
# kind = "headless" can start an engine or reads this run's ledger; runs alone, in order.
# kind = "gpu"      needs a real device; LA_NO_GPU=1 skips exactly these.
# marker            the verdict line a passing gate must print, so silence is not a pass.
# mutation          a shell command, or a list of them, each of which must turn the gate red.
# needs             what a --mutate scratch tree must be given: "import", "capture", "body"
#                   (a body-scoped gate: NOT EXAMINED on a slice arm).

[defaults]
timeout_s = 900

