name: Lint

# Runs `scripts/agent_harness.sh lint` — the exact command CLAUDE.md names as THE gate, so that a green
# local lint means a green CI and there is no second list of checks to drift from the first.
#
# The gate list lives in the harness, never here: a second list drifts from the first.
#
# EXIT 1 IS A VIOLATION. EXIT 2 MEANS A GATE COULD NOT RUN, and it is a failure on purpose — a gate that
# examined nothing is not a pass. Several of these scripts need `rg`, `awk` or `godot`; a job failing with 2
# says the runner environment is broken. Do not "fix" it by making the step non-blocking.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Pinned to the version the project develops against (`godot --version` on the dev host).
      GODOT_VERSION: "4.7-stable"
      GODOT_BIN: "Godot_v4.7-stable_linux.x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check_branch_integration compares the dev branch against main; a shallow clone has neither.
          fetch-depth: 0

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip
          sudo install -m 0755 "${GODOT_BIN}" /usr/local/bin/godot
          godot --version

      - name: Build the GDExtension
        # Without it NetworkGraph and every other native class is undeclared, so check_parse_all fails on
        # scripts that type them and CI lints a tree the project never runs.
        working-directory: addons/local_agents/gdextensions/localagents
        run: |
          sudo apt-get install -y cmake ninja-build
          ./scripts/build_extension.sh --platform linux

      - name: Import project assets
        # A fresh checkout has no .godot cache, so the .glsl kernels are unimported and every class_name is
        # unregistered. The Godot-backed gates (reaction balance, library-only parse) read both.
        run: |
          godot --headless --path . --import 2>&1 | tail -5 || true

      - name: Register class names
        # A fresh checkout has no global script class cache, so a `class_name` is unregistered and every
        # script typing one fails to parse. scripts/new_worktree.sh does this locally for the same reason.
        run: |
          scripts/editor_scan.sh --path . || true

      - name: Lint
        # LA_NO_GPU skips exactly the gates in the harness's GPU_GATES, which check_gpu_gate_list.sh holds
        # to the gates that really launch a sim. They are run on the dev host, never silently dropped.
        env:
          LA_NO_GPU: "1"
        run: |
          scripts/agent_harness.sh lint
